<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grass Renderer Harness — DanbooruInsights e2e</title>
    <!--
      Isolated visual baseline for GraphRenderer.injectSkeleton +
      GraphRenderer.renderGraph (src/ui/graph-renderer.ts).

      Why isolated: the production GrassApp pipeline reaches into Dexie
      and hits ~6 Danbooru endpoints before renderGraph fires. We bypass
      all of that by calling injectSkeleton + renderGraph directly with
      deterministic fixture data so the heatmap pixels in the snapshot
      depend only on the function under test.

      CalHeatmap is loaded from CDN (real implementation) — the JSDOM
      smoke test in test/graph-renderer.test.ts uses a mock, but the
      visual baseline needs the actual SVG geometry.
    -->
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.7/dist/dexie.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap@4.2.4/dist/cal-heatmap.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica,
          Arial, sans-serif;
        background: #ffffff;
      }
      #page {
        padding: 20px;
        max-width: 1000px;
      }
    </style>
  </head>
  <body class="c-users a-show" data-current-user-id="42">
    <div id="page">
      <h1>fixture_user</h1>
      <div class="user-statistics">
        <table>
          <tbody>
            <tr>
              <th>Join Date</th>
              <td>2020-01-01</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script type="module">
      try {
        const {GraphRenderer} = await import('/src/ui/graph-renderer.ts');
        const {SettingsManager} = await import('/src/core/settings.ts');
        const {injectGlobalStyles} = await import('/src/styles.ts');

        injectGlobalStyles();

        // Pin the time so the heatmap renders deterministically. CalHeatmap
        // anchors its 12-month range to the current Date when the year
        // matches today — fixing the seed avoids "month falls on the
        // weekend" differences between CI and local runs.
        const FIXED_YEAR = 2024;

        const settings = new SettingsManager();
        settings.applyTheme('light');

        // Minimal in-memory data manager — only the two methods
        // injectSkeleton actually calls need to behave.
        const dataManager = {
          getGrassSettings: async () => null,
          saveGrassSettings: async () => {},
        };

        // Synthetic daily counts: every 3rd day of 2024 gets a value 1-4
        // so the snapshot shows all four threshold colors without depending
        // on a real upload history.
        const daily = {};
        const start = new Date(`${FIXED_YEAR}-01-01T00:00:00Z`);
        for (let i = 0; i < 366; i++) {
          const d = new Date(start);
          d.setUTCDate(start.getUTCDate() + i);
          if (d.getUTCFullYear() !== FIXED_YEAR) break;
          if (i % 3 === 0) {
            const value = (i % 12) + 1; // 1..12 → spans all four threshold buckets
            const iso = d.toISOString().slice(0, 10);
            daily[iso] = value;
          }
        }

        const dataMap = {daily, hourly: new Array(24).fill(0)};

        const gr = new GraphRenderer(settings, /* db */ {});
        const ok = await gr.injectSkeleton(dataManager, '42');
        if (!ok) {
          throw new Error('injectSkeleton returned false');
        }

        await gr.renderGraph(
          dataMap,
          FIXED_YEAR,
          'uploads',
          'fixture_user',
          [FIXED_YEAR],
          () => {},
          () => {},
          /* skipScroll */ true,
        );

        // injectSkeleton injects an "Initializing..." placeholder that
        // GrassApp clears via setLoading(false) once renderGraph finishes
        // in production. Mirror that here so the baseline reflects what
        // a real user sees, not the transitional state.
        gr.setLoading(false);

        // Two paint cycles: renderGraph awaits cal.paint() internally, but
        // CalHeatmap finalises layout in the rAF after .paint() resolves
        // (see graph-renderer comment around line 2054). Wait two RAFs so
        // the SVG geometry has its final dimensions before the screenshot.
        await new Promise(r =>
          requestAnimationFrame(() => requestAnimationFrame(r)),
        );

        window.__diGraphRenderer = gr;
      } catch (err) {
        console.error('[harness] failed to mount grass-renderer', err);
        document.body.setAttribute('data-harness-error', String(err));
      }
      document.body.setAttribute('data-harness-ready', 'grass-renderer');
    </script>
  </body>
</html>
